			shellScript = "set -euo pipefail\n\nREPOSITORY_ROOT=\"${SRCROOT}/..\"\nCONTENTS_ROOT=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}\"\nHELPER_ROOT=\"${CONTENTS_ROOT}/Helpers\"\nRUNTIME_ROOT=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/MacScopeRuntime\"\nTOOL_ROOT=\"${RUNTIME_ROOT}/.tools\"\nCONFIG_ROOT=\"${RUNTIME_ROOT}/config\"\nGO_BINARY=\"${REPOSITORY_ROOT}/.tools/go/bin/go\"\n\nrequired_files=(\n  \"${GO_BINARY}\"\n  \"${REPOSITORY_ROOT}/.tools/osquery/5.21.0/osqueryi\"\n  \"${REPOSITORY_ROOT}/.tools/osquery/5.21.0/osquery.app/Contents/MacOS/osqueryd\"\n  \"${REPOSITORY_ROOT}/.tools/syft/1.50.0/syft\"\n  \"${REPOSITORY_ROOT}/.tools/grype/0.116.1/grype\"\n  \"${REPOSITORY_ROOT}/config/syft.yaml\"\n  \"${REPOSITORY_ROOT}/config/grype.yaml\"\n  \"${REPOSITORY_ROOT}/tools.lock.json\"\n  \"${REPOSITORY_ROOT}/internal/catalog/findings-catalog.json\"\n)\nfor required_file in \"${required_files[@]}\"; do\n  if [[ ! -e \"${required_file}\" ]]; then\n    echo \"error: required MacScope component is missing: ${required_file}\" >&2\n    exit 1\n  fi\ndone\n\nmkdir -p \"${HELPER_ROOT}\" \"${TOOL_ROOT}/osquery/5.21.0\" \"${TOOL_ROOT}/syft/1.50.0\" \"${TOOL_ROOT}/grype/0.116.1\" \"${TOOL_ROOT}/grype/db\" \"${CONFIG_ROOT}\"\nGOCACHE=\"${PROJECT_TEMP_DIR}/macscope-go-cache\" \"${GO_BINARY}\" build -trimpath -o \"${HELPER_ROOT}/macscope\" \"${REPOSITORY_ROOT}/cmd/macscope\"\nrm -rf \"${TOOL_ROOT}/osquery/5.21.0/osquery.app\"\nditto --norsrc --noextattr --noqtn \"${REPOSITORY_ROOT}/.tools/osquery/5.21.0/osquery.app\" \"${TOOL_ROOT}/osquery/5.21.0/osquery.app\"\nln -sfn \"osquery.app/Contents/MacOS/osqueryd\" \"${TOOL_ROOT}/osquery/5.21.0/osqueryi\"\ncp \"${REPOSITORY_ROOT}/.tools/syft/1.50.0/syft\" \"${TOOL_ROOT}/syft/1.50.0/syft\"\ncp \"${REPOSITORY_ROOT}/.tools/grype/0.116.1/grype\" \"${TOOL_ROOT}/grype/0.116.1/grype\"\ncp \"${REPOSITORY_ROOT}/config/syft.yaml\" \"${CONFIG_ROOT}/syft.yaml\"\ncp \"${REPOSITORY_ROOT}/config/grype.yaml\" \"${CONFIG_ROOT}/grype.yaml\"\ncp \"${REPOSITORY_ROOT}/tools.lock.json\" \"${RUNTIME_ROOT}/tools.lock.json\"\ncp \"${REPOSITORY_ROOT}/internal/catalog/findings-catalog.json\" \"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/findings-catalog.json\"\nchmod 755 \"${HELPER_ROOT}/macscope\" \"${TOOL_ROOT}/osquery/5.21.0/osqueryi\" \"${TOOL_ROOT}/syft/1.50.0/syft\" \"${TOOL_ROOT}/grype/0.116.1/grype\"\ncodesign --verify --deep --strict \"${TOOL_ROOT}/osquery/5.21.0/osquery.app\"\n";
