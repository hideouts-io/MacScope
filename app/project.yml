name: MacScope
options:
  bundleIdPrefix: io.hideouts
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
targets:
  MacScope:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Preview Content"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hideouts.MacScope
        PRODUCT_NAME: MacScope
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacScope
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 MacScope contributors. Apache-2.0 licensed."
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Bundle MacScope scan engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          REPOSITORY_ROOT="${SRCROOT}/.."
          CONTENTS_ROOT="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}"
          HELPER_ROOT="${CONTENTS_ROOT}/Helpers"
          TOOL_ROOT="${CONTENTS_ROOT}/.tools"
          CONFIG_ROOT="${CONTENTS_ROOT}/config"
          GO_BINARY="${REPOSITORY_ROOT}/.tools/go/bin/go"

          required_files=(
            "${GO_BINARY}"
            "${REPOSITORY_ROOT}/.tools/osquery/5.21.0/osqueryi"
            "${REPOSITORY_ROOT}/.tools/syft/1.50.0/syft"
            "${REPOSITORY_ROOT}/.tools/grype/0.116.1/grype"
            "${REPOSITORY_ROOT}/config/syft.yaml"
            "${REPOSITORY_ROOT}/config/grype.yaml"
          )
          for required_file in "${required_files[@]}"; do
            if [[ ! -e "${required_file}" ]]; then
              echo "error: required MacScope component is missing: ${required_file}" >&2
              exit 1
            fi
          done

          mkdir -p "${HELPER_ROOT}" "${TOOL_ROOT}/osquery/5.21.0" "${TOOL_ROOT}/syft/1.50.0" "${TOOL_ROOT}/grype/0.116.1" "${TOOL_ROOT}/grype/db" "${CONFIG_ROOT}"
          GOCACHE="${PROJECT_TEMP_DIR}/macscope-go-cache" "${GO_BINARY}" build -trimpath -o "${HELPER_ROOT}/macscope" "${REPOSITORY_ROOT}/cmd/macscope"
          cp -L "${REPOSITORY_ROOT}/.tools/osquery/5.21.0/osqueryi" "${TOOL_ROOT}/osquery/5.21.0/osqueryi"
          cp "${REPOSITORY_ROOT}/.tools/syft/1.50.0/syft" "${TOOL_ROOT}/syft/1.50.0/syft"
          cp "${REPOSITORY_ROOT}/.tools/grype/0.116.1/grype" "${TOOL_ROOT}/grype/0.116.1/grype"
          cp "${REPOSITORY_ROOT}/config/syft.yaml" "${CONFIG_ROOT}/syft.yaml"
          cp "${REPOSITORY_ROOT}/config/grype.yaml" "${CONFIG_ROOT}/grype.yaml"
          chmod 755 "${HELPER_ROOT}/macscope" "${TOOL_ROOT}/osquery/5.21.0/osqueryi" "${TOOL_ROOT}/syft/1.50.0/syft" "${TOOL_ROOT}/grype/0.116.1/grype"
schemes:
  MacScope:
    build:
      targets:
        MacScope: all
    run:
      config: Debug
    archive:
      config: Release
